<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D2 I-95 pedestrian bridge &middot; information lineage</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7; --panel: #ffffff; --panel2: #eceff2; --text: #1d2127; --muted: #5b636e; --border: #d3d8de;
  --accent: #1f6fd0; --accent-bg: #e3eefb;
  --col-bg: #e9ecf0; --col-border: #d3d8de; --col-label: #4b535d; --node-border: #3b4048;
  --edge: #7a828c; --edge-label-bg: #ffffff; --edge-label-text: #3b4048;
  --fade: 0.14; --hit: #ffb300; --sel: #1f6fd0;
  --amber: #ef9f27; --amber-bg: #fdf0d8; --red: #d84a3a; --red-bg: #fbe3df;
  --green: #2e7d32; --green-bg: #e1f0e2; --grey: #9aa0a6; --grey-bg: #e8eaed; --purple: #7f77dd; --purple-bg: #ebe9fa; --trail: #1d9e75;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171b; --panel: #1c2026; --panel2: #272c34; --text: #e6e8eb; --muted: #9aa3ad; --border: #373d46;
    --accent: #6aa9f0; --accent-bg: #1f3350;
    --col-bg: #1f242b; --col-border: #323943; --col-label: #aab2bc; --node-border: #cdd2d8;
    --edge: #8d95a0; --edge-label-bg: #1c2026; --edge-label-text: #cfd3d8;
    --fade: 0.18; --hit: #ffca3a; --sel: #6aa9f0;
    --amber-bg: #3d2f12; --red-bg: #43211d; --green-bg: #1b3320; --grey-bg: #2d3138; --purple-bg: #2b2850;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
#topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
#topbar h1 { font-size: 15px; font-weight: 650; margin: 0; }
.ctl { display: flex; align-items: center; gap: 6px; }
.searchbox { display: flex; flex-direction: column; }
.searchbox .ctl label { color: var(--muted); }
#qcount { min-height: 1.45em; color: var(--muted); font-size: 12px; }
input[type=search], input[type=text] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; }
#q { width: 230px; }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--border); border-radius: 5px; padding: 3px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed=true] { background: var(--accent-bg); border-color: var(--accent); }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 5px 0 0 5px; margin-left: 0; }
.seg button:last-child { border-radius: 0 5px 5px 0; }
.check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
#legend { display: flex; flex-wrap: wrap; gap: 5px; }
#main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; position: relative; min-width: 0; background: var(--bg); }
#cy { position: absolute; inset: 0; }
#cy-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--muted); font-size: 14px; }
#pane { width: 34vw; min-width: 380px; max-width: 560px; flex: none; overflow: auto; padding: 12px 14px 24px; background: var(--panel); border-left: 1px solid var(--border); }
@media (max-width: 900px) {
  #main { flex-direction: column; }
  #stage { flex: 1 1 55%; min-height: 280px; }
  #pane { width: auto; min-width: 0; max-width: none; flex: 1 1 45%; border-left: 0; border-top: 1px solid var(--border); }
  #q { width: 160px; }
}
.h-MATCH { --hc: #2e7d32; } .h-CHANGED { --hc: #ef9f27; } .h-MISSING { --hc: #d84a3a; } .h-EMULATED { --hc: #7f77dd; } .h-NONE { --hc: #9aa0a6; }
.chip { display: inline-block; padding: 0 8px; border: 1px solid var(--border); border-radius: 11px; background: var(--panel2); font-size: 12px; line-height: 1.6; color: var(--text); }
button.chip { cursor: pointer; }
.chip.hc { border-color: var(--hc, var(--grey)); }
.chip.hc[aria-pressed=true] { background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--hc, var(--grey)); font-weight: 600; }
.dot { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 50%; background: var(--hc, var(--grey)); }
.chip.amber { border-color: var(--amber); background: var(--amber-bg); }
.chip.red { border-color: var(--red); background: var(--red-bg); }
.chip.green { border-color: var(--green); background: var(--green-bg); }
.chip.grey { border-color: var(--grey); background: var(--grey-bg); }
.chip.purple { border-color: var(--purple); background: var(--purple-bg); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
#pane h2 { font-size: 15px; line-height: 1.3; margin: 0 0 6px; }
#pane h3 { margin: 16px 0 5px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
#pane p { margin: 4px 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; padding: 1px 7px; }
.mono, code { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 12px; word-break: break-all; }
button.link { background: none; border: 0; padding: 0; color: var(--accent); text-align: left; cursor: pointer; }
button.link:hover { text-decoration: underline; }
h2 button.link { font: inherit; font-weight: 650; }
.hdr { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 5px 12px; }
.tabs button[aria-selected=true] { border-bottom-color: var(--accent); font-weight: 600; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 3px 8px; margin: 6px 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
dl.kvs { margin: 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { margin: 3px 0; }
.expand { margin: 4px 0 8px; padding: 6px 9px; background: var(--panel2); border-left: 3px solid var(--accent); border-radius: 3px; }
.sec { margin: 6px 0; } .lbl { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.item { border-bottom: 1px solid var(--border); }
.itembtn { display: block; width: 100%; background: none; border: 0; border-radius: 0; padding: 5px 2px; text-align: left; }
.itembtn:hover { background: var(--panel2); }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tscroll { overflow-x: auto; margin: 4px 0; }
table.pt { width: 100%; border-collapse: collapse; font-size: 12px; }
table.pt th, table.pt td { padding: 3px 5px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
table.pt th { color: var(--muted); font-weight: 600; white-space: nowrap; }
table.pt tr.chg td { background: var(--amber-bg); }
table.pt tr.chg td:first-child { border-left: 3px solid var(--amber); }
.ptwrap input { width: 100%; margin: 2px 0; }
#pane h4 { margin: 14px 0 4px; font-size: 13px; line-height: 1.35; }
.lkhead .chips { display: inline-flex; margin: 0 0 0 4px; vertical-align: middle; }
.lkhead button.small { margin-left: 6px; font-weight: 400; }
details.grp, details.rec { margin: 8px 0; border: 1px solid var(--border); border-radius: 6px; padding: 0 9px; }
details.grp > summary, details.rec > summary { cursor: pointer; padding: 5px 0; font-weight: 600; }
details.grp[open] > summary, details.rec[open] > summary { border-bottom: 1px solid var(--border); margin-bottom: 4px; }
details.rec { margin: 4px 0 8px; } details.rec > summary { font-weight: 400; color: var(--muted); }
.pmatch li { overflow-wrap: anywhere; }
.tcard { border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; margin: 6px 0; overflow-wrap: anywhere; }
.tcard.origin { border: 2px solid var(--trail); padding: 5px 8px; }
.tcard .arrow { color: var(--muted); padding-left: 10px; line-height: 1.2; }
.tcard .chips { align-items: center; }
.key { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.sw { display: inline-block; width: 34px; flex: none; border-top: 3px solid var(--edge); }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0; }
.stat div { background: var(--panel2); border-radius: 6px; padding: 6px 8px; text-align: center; }
.stat b { display: block; font-size: 20px; line-height: 1.2; }
#scrub input[type=range] { width: 150px; margin: 0; vertical-align: middle; accent-color: var(--accent); }
#scrub output { min-width: 80px; font-variant-numeric: tabular-nums; }
.glyph { display: inline-block; min-width: 1.1em; text-align: center; font-weight: 700; }
.glyph.ok { color: var(--green); } .glyph.stale { color: var(--amber); } .glyph.none { color: var(--grey); }
.walkbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
.hop { border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px 10px; margin: 8px 0; }
.hop h3:first-of-type { margin-top: 10px; }
ul.hops li { margin: 0; }
ul.hops .itembtn { display: flex; gap: 6px; align-items: baseline; padding: 4px; }
ul.hops li.cur .itembtn { background: var(--accent-bg); }
ul.hops .num { color: var(--muted); min-width: 2em; text-align: right; }
form.draft { display: grid; grid-template-columns: 50px 1fr; gap: 5px 8px; align-items: center; margin: 6px 0; }
form.draft label { color: var(--muted); }
form.draft input { width: 100%; }
form.draft input[type=date] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 2px 8px; }
.row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0; }
textarea.snip { display: block; width: 100%; min-height: 170px; margin: 6px 0 2px; padding: 6px 8px; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 11.5px; line-height: 1.4; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 5px; resize: vertical; }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>D2 I-95 pedestrian bridge &middot; information lineage</h1>
    <div class="searchbox">
      <div class="ctl"><label for="q">Search</label><input id="q" type="search" autocomplete="off" placeholder="id, label, parameter, decision, item"></div>
      <div id="qcount" aria-live="polite"></div>
    </div>
    <div class="seg" id="dirs" role="group" aria-label="Cone direction">
      <button type="button" data-dir="both" aria-pressed="true" title="Show upstream and downstream of the selected node">Both</button>
      <button type="button" data-dir="up" aria-pressed="false" title="Show only what feeds the selected node">Upstream</button>
      <button type="button" data-dir="down" aria-pressed="false" title="Show only what the selected node feeds">Downstream</button>
    </div>
    <label class="check"><input type="checkbox" id="isolate"> Isolate</label>
    <div class="seg" role="group" aria-label="Zoom">
      <button type="button" id="zfit" aria-label="Fit graph to window" title="Fit graph to window">Fit</button>
      <button type="button" id="zin" aria-label="Zoom in" title="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out" title="Zoom out">&minus;</button>
    </div>
    <div id="legend" role="group" aria-label="Filter nodes by health"></div>
    <div class="ctl" id="scrub" title="Show the record as it stood on a date. Nodes registered later fade; later decisions and coherence items are hidden in the tabs.">
      <label for="asof">As of</label>
      <input id="asof" type="range" min="0" max="0" value="0" step="1" aria-label="Show the record as of a date">
      <output id="asof-out" for="asof"></output>
      <button type="button" id="asof-latest" class="small" title="Back to the latest date" disabled>Latest</button>
    </div>
  </header>
  <div id="main">
    <section id="stage" aria-label="Lineage graph">
      <div id="cy"></div>
      <div id="cy-msg" hidden></div>
      <noscript>This viewer needs JavaScript.</noscript>
    </section>
    <aside id="pane" aria-label="Details"></aside>
  </div>
</div>
<script id="lineage-data" type="application/json">/*__LINEAGE_DATA__*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.4/cytoscape.min.js" referrerpolicy="no-referrer"></script>
<script>
(function () {
'use strict';

const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const HEALTH = { MATCH: '#2e7d32', CHANGED: '#ef9f27', MISSING: '#d84a3a', EMULATED: '#7f77dd', NONE: '#9aa0a6' };
const DARK_TEXT = { CHANGED: true, NONE: true };
const INK = '#1d2127';
// Node shapes by kind. tw = label wrap width, pad = padding, w = fixed width, bw = border width.
const KIND = {
  source: { shape: 'round-rectangle', tw: 150, pad: 8, w: 170 },
  tool: { shape: 'ellipse', tw: 122, pad: 12, w: 170 },
  case: { shape: 'round-rectangle', tw: 150, pad: 8, w: 170, bw: 3 },
  report: { shape: 'rectangle', tw: 150, pad: 8, w: 170 },
  analysis: { shape: 'hexagon', tw: 120, pad: 10, w: 176 },
  model: { shape: 'barrel', tw: 130, pad: 10, w: 176 },
  deliverable: { shape: 'round-tag', tw: 140, pad: 8, w: 172 },
  external: { shape: 'diamond', tw: 88, pad: 26, w: 176, dashed: true }
};
const EDGE_KEY = [
  ['depends_on', 'Depends on (information flows left to right)', 'solid', '#7a828c'],
  ['supplement', 'Supplement (unregistered link or tool)', 'dashed', '#7a828c'],
  ['check', 'Machine check', 'dotted', '#378add'],
  ['parameter', 'Parameter supply', 'dashed', '#1d9e75'],
  ['mapping', 'Input mapping', 'solid', '#7f77dd'],
  ['', 'Flag: analysis identity mismatch', 'dashed', '#d84a3a'],
  ['', 'Flag: dependency under review', 'solid', '#ef9f27'],
  ['', 'Parameter trail (labelled with the names crossing it)', 'solid', '#1d9e75']
];
const FLAGS = {
  'identity-mismatch': ['Analysis identity mismatch', 'red'],
  review: ['Dependency under review', 'amber'],
  unregistered: ['Unregistered relation', 'grey']
};
const PCOLS = [['name', 'Name'], ['value', 'Value'], ['unit', 'Unit'], ['source_name', 'Source name'], ['source_value', 'Source value'],
  ['target_name', 'Target name'], ['target_value', 'Target value'], ['state', 'State'], ['load_case', 'Load case'],
  ['combination', 'Comb.'], ['element', 'Element'], ['x_in', 'x (in)'], ['region', 'Region'], ['before', 'Before'],
  ['after', 'After'], ['basis', 'Basis'], ['governing', 'Governing'], ['role', 'Role'], ['source', 'Source'],
  ['source_text', 'Source text'], ['source_status', 'Source status'], ['status', 'Status'], ['detail', 'Detail']];
const COL_W = 230, PITCH = 72, GAP = 12, LIMIT = 20, PMAX = 40;
const TRAIL = '#1d9e75';
// Statuses that mean the two sides of a hop do not agree. CHANGED is not one: it marks a Mathcad
// region whose template value was replaced by the case input, which is the mapping doing its job.
const DIFFER = /^(DIFFERS|NAME NOT IN JOURNAL)$/;
const LINK_STATUS_TITLE = {
  MATCH: 'The value on each side of this hop is the same',
  DIFFERS: 'The two sides carry different numbers: the registered file is not the export the case was built from',
  CHANGED: 'The template value in this Mathcad region was replaced by the case input (expected)',
  UNCHANGED: 'The case input equals the template value, so the Mathcad region did not change',
  'NAME NOT IN JOURNAL': 'The formula names a journal module or variable that the registered journal file does not contain'
};
// Node parameter groups shown under "Other parameters", by role (role "input" is covered by the Inputs section).
const ROLE_GROUPS = [['envelope', 'Envelope rows'], ['summary', 'FBMP summary rows'], ['identity', 'XML identity'], ['formula', 'Formula trace'], ['output', 'Results']];
const ISSUE_ORDER = ['Open', 'Awaiting source', 'Deferred', 'Closed'];
const CHECK = '✓', RING = '○';
const SIGNOFF_SCHEMA = 'd2mpdb.lineage-signoff';

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const fmt = v => v == null ? '' : typeof v === 'boolean' ? (v ? 'yes' : 'no') : String(v);
const chip = (t, cls, title) => '<span class="chip ' + (cls || '') + '"' + (title ? ' title="' + esc(title) + '"' : '') + '>' + esc(t) + '</span>';
const stCls = s => { s = String(s || '').toUpperCase(); return /^(MATCH|OK|PASS)/.test(s) ? 'green' : /^(CHANGED|WARN|REVIEW)/.test(s) ? 'amber' : /^(ERROR|MISSING|FAIL|MISMATCH)/.test(s) ? 'red' : s === 'EMULATED' ? 'purple' : 'grey'; };
const issCls = s => s === 'Open' || s === 'Awaiting source' ? 'amber' : s === 'Closed' ? 'green' : 'grey';
const kv = (k, v) => v === '' || v == null ? '' : '<div class="kv"><dt>' + k + '</dt><dd>' + v + '</dd></div>';
const sec = (t, v) => v ? '<div class="sec"><div class="lbl">' + t + '</div><div>' + md(v) + '</div></div>' : '';
const shaHtml = s => s ? '<span class="mono" title="' + esc(s) + '">' + esc(s.slice(0, 12)) + '</span>' : '';
const copyBtn = (v, what) => '<button type="button" class="small" data-copy="' + esc(v) + '" aria-label="Copy ' + what + '">Copy</button>';
const isoDay = s => { const m = /^(\d{4}-\d{2}-\d{2})/.exec(String(s == null ? '' : s)); return m ? m[1] : ''; };
const todayIso = () => { const d = new Date(), p = x => String(x).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };
// Sign-off state of a node or edge: 'ok' (signed, hashes current), 'stale' (signed, hashes changed since) or 'none'.
const soState = so => !so ? 'none' : so.stale ? 'stale' : 'ok';
const SO_TITLE = { ok: 'Signed off; register hashes unchanged since', stale: 'Signed off, but the register hashes have changed since', none: 'Not signed off' };
const soGlyph = so => { const s = soState(so); return '<span class="glyph ' + s + '" title="' + SO_TITLE[s] + '">' + (s === 'none' ? RING : CHECK) + '</span>'; };
const soChip = so => { const s = soState(so); return chip(s === 'ok' ? 'Signed' : s === 'stale' ? 'Signed, stale' : 'Not signed', s === 'ok' ? 'green' : s === 'stale' ? 'amber' : 'grey', SO_TITLE[s]); };

let D = null, cy = null, idx = null;
const by = { nodes: {}, edges: {}, dec: {}, iss: {} };
const adj = { in: {}, out: {} };
// Parameter links (one per parameter crossing an edge): by target node, by source node, by "node|name" on either side, and by edge then index.
const lk = { in: {}, out: {}, tin: {}, sout: {}, byEdge: {} };
const stageIdx = {};
const state = {
  dir: 'both', isolate: false, selId: null, selEdge: null, cone: null, health: {}, search: null,
  open: { dec: null, iss: null }, refHits: new Set(), tab: 'overview',
  walk: null,            // { target, hops: [edge ids in information-flow order], i }
  trail: null,           // { node, name, hops: [links], up, down, nodes: Set, edges: Set, labels } -- one parameter followed through the network
  detOpen: {},           // open/closed state of the <details> groups the reader toggled, by key
  dates: [], asOfIdx: 0, asOf: '',  // time scrubber: sorted unique dates; current index and date
  draft: null, drafts: {}  // open draft form { id, by, on, basis, json }; drafts kept this session, by id
};
let graphKey = null, zmode = '', zlab = true, lastTap = { id: null, t: 0 }, pts = {}, ptSeq = 0, paneKey = '';

// ---------- data ----------
function loadData() {
  D = JSON.parse(document.getElementById('lineage-data').textContent);
  ['stages', 'nodes', 'edges', 'decisions', 'issues'].forEach(k => { D[k] = D[k] || []; });
  D.health_legend = D.health_legend || {};
  if (!D.stages.length) D.stages = [{ id: 'all', label: 'All' }];
  D.stages.forEach((s, i) => { stageIdx[s.id] = i; });
  D.nodes.forEach(n => {
    ['parameters', 'checks', 'decisions', 'issues', 'open_issues'].forEach(k => { n[k] = n[k] || []; });
    if (n.label == null) n.label = n.id;
    by.nodes[n.id] = n; adj.in[n.id] = []; adj.out[n.id] = [];
  });
  D.edges.forEach(e => {
    ['parameters', 'checks', 'flags'].forEach(k => { e[k] = e[k] || []; });
    by.edges[e.id] = e;
    if (adj.out[e.source] && adj.in[e.target]) { adj.out[e.source].push(e); adj.in[e.target].push(e); }
  });
  D.links = (D.links || []).filter(l => by.nodes[l.source] && by.nodes[l.target]);
  D.links.forEach((l, i) => {
    ['source_name', 'source_value', 'target_name', 'target_value', 'unit', 'detail', 'status'].forEach(k => { l[k] = l[k] == null ? '' : String(l[k]); });
    l.i = i;
    (lk.in[l.target] = lk.in[l.target] || []).push(l); (lk.out[l.source] = lk.out[l.source] || []).push(l);
    if (l.target_name) (lk.tin[l.target + '|' + l.target_name] = lk.tin[l.target + '|' + l.target_name] || []).push(l);
    if (l.source_name) (lk.sout[l.source + '|' + l.source_name] = lk.sout[l.source + '|' + l.source_name] || []).push(l);
    (lk.byEdge[l.edge] = lk.byEdge[l.edge] || {})[l.index] = l;
  });
  D.decisions.forEach(d => { by.dec[d.id] = d; d.refs = d.refs || {}; });

    const k = n + '|' + nm;
    if (seen.has(k)) return;
    seen.add(k);

  };
  const fall = (n, nm, seen) => {
    const k = n + '|' + nm;
    if (seen.has(k)) return;
    seen.add(k);

    const id = ready.shift();
    rank[id] = next++;
    adj.out[id].forEach(e => { if (cn.edges.has(e.id) && --indeg[e.target] === 0) ready.push(e.target); });
  }
  [...cn.nodes].sort(order).forEach(id => { if (rank[id] === undefined) rank[id] = next++; }); // only if the record has a cycle
  return rank;
}

// The hops of a walk: every edge in the node's upstream cone, ordered so each hop's source has been reached before it.
function walkHops(id) {
  const cn = cone(id, 'up'), rank = topoRank(cn);
  return [...cn.edges].map(eid => by.edges[eid]).sort((a, b) => rank[a.target] - rank[b.target] || rank[a.source] - rank[b.source]).map(e => e.id);
}

function startWalk(id, hop) {
  if (!by.nodes[id]) return;
  const hops = walkHops(id);
  state.walk = { target: id, hops, i: Math.max(0, Math.min(hops.length - 1, hop || 0)) };
  state.trail = null; state.selId = id; state.selEdge = null; state.draft = null;
  refreshSelection(); centerHop();
}

function walkTo(i) {
  const w = state.walk;
  if (!w || !w.hops.length) return;
  w.i = Math.max(0, Math.min(w.hops.length - 1, i)); state.draft = null;
  applyView(); renderPane(); centerHop();
}

function endWalk() {
  if (!state.walk) return;
  state.walk = null; state.draft = null;
  refreshSelection();
}

function centerHop() {
  const w = state.walk;
  if (!cy || !w || !w.hops.length) return;
  const e = cy.getElementById(w.hops[w.i]);
  if (e.nonempty()) cy.animate({ center: { eles: e } }, { duration: 200 });
}

function walkCounts(w) {
  const c = { ok: 0, none: 0, stale: 0 };
  w.hops.forEach(id => { c[soState(by.edges[id].signoff)]++; });
  return c;
}

// ---------- sign-off drafts and export ----------
function toggleDraft(id) {
  state.draft = state.draft && state.draft.id === id ? null : { id, by: '', on: todayIso(), basis: '', json: '' };
  renderPane();
}

// Turn the form's fields into the JSON entry for signoff.json. Only the person's own fields are typed in; the hashes are the current register hashes.
function makeDraft(id) {
  const d = state.draft;
  if (!d || d.id !== id || !(by.nodes[id] || by.edges[id])) return;
  const by_ = d.by.trim(), basis = d.basis.trim(), on = isoDay(d.on);
  if (!by_ || !basis || !on) return;
  d.json = JSON.stringify({ id, by: by_, on, basis, hashes: curHashes(id) }, null, 2);
  renderPane();
}

function keepDraft(id) {
  const d = state.draft;
  if (!d || d.id !== id || !d.json) return;
  state.drafts[id] = { entry: JSON.parse(d.json), json: d.json };
  renderPane();
}

// The sidecar as it stands: recorded entries plus any drafts kept this session, in the file's own shape.
function signoffDocument() {
  const S = D.signoff, entries = (S.entries || []).map(e => ({ id: e.id, by: e.by, on: e.on, basis: e.basis, hashes: e.hashes }));
  Object.keys(state.drafts).sort().forEach(id => entries.push(state.drafts[id].entry));
  return { schema: S.schema || SIGNOFF_SCHEMA, schema_version: S.schema_version || 1, note: S.note || '', signoffs: entries };
}

function downloadSignoffs() {
  const text = JSON.stringify(signoffDocument(), null, 2) + '\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = 'signoff.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- time scrubber ----------
function setAsOf(i) {
  const ds = state.dates;
  if (!ds.length) return;
  state.asOfIdx = Math.max(0, Math.min(ds.length - 1, i)); state.asOf = ds[state.asOfIdx];
  $('#asof').value = state.asOfIdx;
  $('#asof-out').textContent = state.asOf;
  $('#asof-latest').disabled = state.asOfIdx === ds.length - 1;
  applyView();
  if (!state.selId && !state.selEdge) renderPane();
}

function fitCone() {
  if (state.trail) { fitTrail(); return; }
  if (!cy || !state.cone) return;
  const eles = cy.nodes(':childless').filter(n => state.cone.nodes.has(n.id()));
  if (eles.nonempty()) cy.animate({ fit: { eles, padding: 40 } }, { duration: 250 });
}

function toggleRef(kind, id) {
  const other = kind === 'dec' ? 'iss' : 'dec';
  state.open[kind] = state.open[kind] === id ? null : id;
  state.open[other] = null;
  const o = state.open[kind] && (kind === 'dec' ? by.dec : by.iss)[state.open[kind]];
  state.refHits = new Set(o ? (o.refs.sources || []).filter(s => by.nodes[s]) : []);
  applyView(); renderPane();
}

function doSearch() {
  const toks = $('#q').value.toLowerCase().split(/\s+/).filter(Boolean), out = $('#qcount');
  if (!toks.length) { state.search = null; out.textContent = ''; applyView(); renderIdlePane(); return; }
  const nodes = new Set(), edges = new Set(), ctx = new Set();
  D.nodes.forEach(n => { if (toks.every(t => idx.nd[n.id].includes(t))) nodes.add(n.id); });
  D.edges.forEach(e => { if (toks.every(t => idx.ed[e.id].includes(t))) { edges.add(e.id); ctx.add(e.source); ctx.add(e.target); } });
  const params = idx.pm.filter(p => toks.every(t => p.low.includes(t)));
  state.search = { nodes, edges, ctx, params };
  out.textContent = nodes.size + ' nodes · ' + edges.size + ' edges · ' + params.length + ' parameters match';
  applyView(); renderIdlePane();
}
// The overview tabs carry the parameter matches, so redraw them when nothing is selected.
function renderIdlePane() { if (!state.selId && !state.selEdge && !state.walk && !state.trail) renderPane(); }

// ---------- detail pane ----------
const ptKeyCols = rows => {
  const known = PCOLS.filter(c => rows.some(r => r[c[0]] != null && r[c[0]] !== ''));
  const names = new Set(PCOLS.map(c => c[0]).concat('changed'));
  const extra = [];
  rows.forEach(r => Object.keys(r).forEach(k => { if (!names.has(k) && !extra.includes(k) && r[k] != null && r[k] !== '') extra.push(k); }));
  return known.concat(extra.map(k => [k, k]));
};

// A filterable table that collapses to LIMIT rows. opt: cols (explicit [key, label] columns), skip (column keys to drop), label (filter's aria-label),
// cell(row, key, i) (HTML for a cell, or null for the default text), act(row, i) (HTML for an extra action column, e.g. a Trace button) and actFirst.
function ptHtml(rows, opt) {
  opt = opt || {};
  if (!rows.length) return '<p class="muted">None.</p>';
  const key = 'pt' + (++ptSeq), cols = (opt.cols || ptKeyCols(rows)).filter(c => !(opt.skip || []).includes(c[0])), chg = rows.filter(r => r.changed === true).length;
  pts[key] = { rows, cols, opt, all: false, filter: '', hay: rows.map(r => cols.map(c => fmt(r[c[0]])).join(' ').toLowerCase()) };
  return '<div class="ptwrap" data-key="' + key + '">' +
    (rows.some(r => 'changed' in r) ? '<p class="muted">' + chg + ' of ' + rows.length + ' rows changed (highlighted).</p>' : '') +
    '<input type="search" class="pt-filter" data-key="' + key + '" placeholder="Filter ' + rows.length + ' rows" aria-label="Filter ' + esc(opt.label || 'parameters') + '">' +
    '<div class="pt-body">' + ptBody(key) + '</div></div>';
}

function ptBody(key) {
  const t = pts[key], toks = t.filter.toLowerCase().split(/\s+/).filter(Boolean), hit = [], o = t.opt;
  t.rows.forEach((r, i) => { if (toks.every(k => t.hay[i].includes(k))) hit.push(i); });
  if (!hit.length) return '<p class="muted">No rows match.</p>';
  const shown = t.all ? hit : hit.slice(0, LIMIT);
  const ths = t.cols.map(c => '<th>' + esc(c[1]) + '</th>'), acth = o.act ? '<th>Trace</th>' : '';
  let h = '<div class="tscroll"><table class="pt"><thead><tr>' + (o.actFirst ? acth : '') + ths.join('') + (o.actFirst ? '' : acth) + '</tr></thead><tbody>' +
    shown.map(i => {
      const r = t.rows[i], act = o.act ? '<td>' + o.act(r, i) + '</td>' : '';
      return '<tr' + (r.changed === true ? ' class="chg"' : '') + '>' + (o.actFirst ? act : '') + t.cols.map(c => {
        const x = o.cell ? o.cell(r, c[0], i) : null;
        return '<td>' + (x == null ? esc(fmt(r[c[0]])) : x) + '</td>';
      }).join('') + (o.actFirst ? '' : act) + '</tr>';
    }).join('') + '</tbody></table></div>';
  h += '<div class="muted">Showing ' + shown.length + ' of ' + hit.length + (hit.length < t.rows.length ? ' (filtered from ' + t.rows.length + ')' : '');
  if (hit.length > LIMIT) h += ' <button type="button" class="small" data-act="more" data-key="' + key + '">' + (t.all ? 'Show first ' + LIMIT : 'Show all ' + hit.length) + '</button>';
  return h + '</div>';
}

const checksHtml = cs => cs.length ? '<ul class="plain">' + cs.map(c => '<li>' + chip(c.status, stCls(c.status)) + ' <span class="mono">' + esc(c.check_id) + '</span>' +

const lkCls = s => { s = String(s || '').toUpperCase(); return s === 'MATCH' ? 'green' : s === 'DIFFERS' || s === 'NAME NOT IN JOURNAL' ? 'red' : s === 'CHANGED' ? 'amber' : 'grey'; };

const edgeFlagChips = e => e.flags.map(f => FLAGS[f] ? chip(FLAGS[f][0], FLAGS[f][1]) : chip(f, 'grey')).join('');

// Links grouped by the edge they cross, in information-flow order of the node at the far end (end = 'source' or 'target').
function linkGroups(list, end) {
  const g = {}, order = [];
  list.forEach(l => {
    if (!g[l.edge]) { g[l.edge] = { e: by.edges[l.edge], other: by.nodes[l[end]], list: [] }; order.push(g[l.edge]); }
    g[l.edge].list.push(l);
  });
  return order.sort((a, b) => colOf(a.other) - colOf(b.other) || String(a.other.label).localeCompare(b.other.label));
}

    kv('Scope', esc(n.scope)) + kv('Origin', esc(n.origin)) + kv('Notes', esc(n.notes)) + kv('Case', esc(n.case_name)) + kv('Analysis', esc(n.analysis_id)) +
    kv('Confirmations', n.confirmations ? Object.keys(n.confirmations).map(k => esc(k) + ': ' + (n.confirmations[k] ? 'yes' : 'no')).join('<br>') : '');
  if (rec) h += '<details class="rec" data-key="rec"' + (state.detOpen.rec ? ' open' : '') + '><summary>Record details</summary><dl class="kvs">' + rec + '</dl></details>';
  h += inputsHtml(n) + outputsHtml(n) + otherParamsHtml(n);
  if (n.checks.length) h += '<h3>Checks</h3>' + checksHtml(n.checks);
  h += signoffHtml(n.signoff, n.id);
  if (n.decisions.length) {
    h += '<h3>Decisions</h3><div class="chips">' + n.decisions.map(id => '<button type="button" class="chip' + (state.open.dec === id ? ' hc' : '') + '" data-act="dec" data-id="' + esc(id) + '" aria-expanded="' + (state.open.dec === id) + '">' + esc(id) + '</button>').join('') + '</div>';
    if (state.open.dec && n.decisions.includes(state.open.dec) && by.dec[state.open.dec]) h += decBlock(by.dec[state.open.dec], true);
  }
  if (n.issues.length) {
    h += '<h3>Coherence items</h3><div class="chips">' + n.issues.map(id => {
      const i = by.iss[id] || { status: '' };
      return '<button type="button" class="chip ' + issCls(i.status) + '" data-act="iss" data-id="' + esc(id) + '" title="' + esc((i.status || '') + (i.item ? ': ' + i.item : '')) + '" aria-expanded="' + (state.open.iss === id) + '">' + esc(id) + '</button>';
    }).join('') + '</div>';
    if (state.open.iss && n.issues.includes(state.open.iss) && by.iss[state.open.iss]) h += issBlock(by.iss[state.open.iss], true);
  }
  const cu = cone(n.id, 'up').nodes.size - 1, cd = cone(n.id, 'down').nodes.size - 1;
  h += '<h3>Upstream (' + up.length + ' direct, ' + cu + ' in cone)</h3>' + nb(up, 'source') +
    '<h3>Downstream (' + down.length + ' direct, ' + cd + ' in cone)</h3>' + nb(down, 'target');
  return h;
}

const edgeChips = e => '<div class="chips">' + chip(e.kind) + (e.label ? chip(e.label) : '') + edgeFlagChips(e) + soChip(e.signoff) + '</div>';

// The evidence carried by a relation: identity comparisons, FB-MultiPier export facts, checks, sign-off and parameters.
function edgeFacts(e) {
  const sha = (label, v) => kv(label, shaHtml(v) + (v ? ' ' + copyBtn(v, label) : ''));
  const yesNo = (v, goodWhenYes) => chip(v ? 'yes' : 'no', (v === goodWhenYes) ? 'green' : 'red');
  let h = '';
  const ai = e.analysis_identity;
  if (ai) h += '<h3>Analysis identity</h3><dl class="kvs">' + sha('Case requires', ai.case_requires_sha256) + sha('Registered', ai.registered_sha256) +
    kv('Match', yesNo(ai.match, true)) + kv('File present', yesNo(ai.file_present, true)) + '</dl>';
  const ci = e.case_identity;
  if (ci) h += '<h3>Case identity</h3><dl class="kvs">' + sha('Mapping case', ci.mapping_case_sha256) + sha('Registered', ci.registered_sha256) + kv('Match', yesNo(ci.match, true)) + '</dl>';
  const f = e.fbmp;
  if (f) h += '<h3>FB-MultiPier export</h3><dl class="kvs">' + kv('Version', esc(f.version)) +
    kv('Cap length', typeof f.cap_length_ft === 'number' ? f.cap_length_ft.toFixed(2) + ' ft (' + (f.cap_length_ft * 12).toFixed(1) + ' in)' : esc(f.cap_length_ft)) +
    kv('Pile centres', esc((f.pile_centers_in || []).join(', ')) + ' in') + kv('Bearing stations', esc((f.bearing_stations_in || []).join(', ')) + ' in') +
    kv('Combinations', Object.keys(f.combinations || {}).map(k => esc(k) + ': ' + esc(f.combinations[k])).join('<br>')) + '</dl>';
  const fs = e.fbmp_summary;
  if (fs && Object.keys(fs).length) h += '<h3>Extracted vs summary</h3><div class="tscroll"><table class="pt"><thead><tr><th>Quantity</th><th>Extracted</th><th>Summary</th></tr></thead><tbody>' +
    Object.keys(fs).map(k => '<tr' + (fs[k].extracted !== fs[k].summary ? ' class="chg"' : '') + '><td>' + esc(k) + '</td><td>' + esc(fmt(fs[k].extracted)) + '</td><td>' + esc(fmt(fs[k].summary)) + '</td></tr>').join('') + '</tbody></table></div>';
  if (e.checks.length) h += '<h3>Checks</h3>' + checksHtml(e.checks);
  h += signoffHtml(e.signoff, e.id);
  // Trace: from the target name of each row; mapping rows start at the case input they read instead (it is the name with a history).
  return h + '<h3>Parameters (' + e.parameters.length + ')</h3>' + ptHtml(e.parameters, { label: 'relation parameters', actFirst: true, act: (r, i) => {
    const l = (lk.byEdge[e.id] || {})[i], mapping = (l ? l.kind : e.kind) === 'mapping';
    return mapping && r.source_name ? traceBtn(e.source, r.source_name) : r.target_name ? traceBtn(e.target, r.target_name) : '';
  } });
}

function edgeHtml(e) {
  const s = by.nodes[e.source], t = by.nodes[e.target];
  return '<div class="hdr"><span class="muted">Relation</span><button type="button" class="small" data-act="back">&larr; ' + (state.selId ? 'Back to node' : state.trail ? 'Back to trail' : 'Overview') + '</button></div>' +
    '<h2>' + nodeLink(s) + ' &rarr; ' + nodeLink(t) + '</h2>' + edgeChips(e) + edgeFacts(e);
}

function walkHtml(w) {
  const t = by.nodes[w.target], c = walkCounts(w), n = w.hops.length, e = n ? by.edges[w.hops[w.i]] : null;
  let h = '<div class="hdr"><span class="muted">Verification walk</span><button type="button" class="small" data-act="wexit">Exit walk</button></div>' +
    '<h2>' + nodeLink(t) + '</h2><div class="chips">' + chip(t.id, 'mono') + healthChip(t) + soChip(t.signoff) + '</div>' +
    '<p class="muted">The ' + ((state.cone ? state.cone.nodes.size : 1) - 1) + ' nodes that feed this one, walked in information-flow order. Each hop is one relation; a hop is signed when <span class="mono">' + esc(D.signoff.path) + '</span> records a sign-off for it.</p>' +
    '<div class="stat"><div><b>' + c.ok + '</b>signed</div><div><b>' + c.none + '</b>unsigned</div><div><b>' + c.stale + '</b>stale</div></div>';
  if (!e) return h + '<p class="muted">Nothing feeds this node, so there is no hop to walk.</p>' + signoffHtml(t.signoff, t.id);
  const s = by.nodes[e.source], tt = by.nodes[e.target];
  h += '<div class="walkbar"><button type="button" class="small" data-act="wstep" data-d="-1"' + (w.i === 0 ? ' disabled' : '') + '>&larr; Previous</button>' +
    '<b>Hop ' + (w.i + 1) + ' of ' + n + '</b><button type="button" class="small" data-act="wstep" data-d="1"' + (w.i === n - 1 ? ' disabled' : '') + '>Next &rarr;</button></div>';
  h += '<div class="hop"><h2>' + soGlyph(e.signoff) + ' ' + nodeLink(s) + ' &rarr; ' + nodeLink(tt) + '</h2>' + edgeChips(e) +
    '<dl class="kvs">' + kv('From', healthChip(s) + ' ' + soChip(s.signoff) + (s.registered === false ? ' ' + chip('unregistered', 'grey') : '') + (s.open_issues.length ? ' ' + chip(s.open_issues.length + ' open', 'amber', 'Open coherence items') : '')) +
    kv('To', healthChip(tt) + ' ' + soChip(tt.signoff) + (tt.registered === false ? ' ' + chip('unregistered', 'grey') : '') + (tt.open_issues.length ? ' ' + chip(tt.open_issues.length + ' open', 'amber', 'Open coherence items') : '')) + '</dl>' +
    edgeFacts(e) + '</div>';
  h += '<h3>All hops</h3><ul class="plain hops">' + w.hops.map((id, i) => {
    const x = by.edges[id];
    return '<li' + (i === w.i ? ' class="cur"' : '') + '><button type="button" class="itembtn" data-act="wgo" data-i="' + i + '" aria-current="' + (i === w.i) + '">' + soGlyph(x.signoff) +
      '<span class="num">' + (i + 1) + '.</span><span>' + esc(by.nodes[x.source].label) + ' &rarr; ' + esc(by.nodes[x.target].label) + ' <span class="muted">(' + esc(x.label || x.kind) + ')</span></span></button></li>';
  }).join('') + '</ul>';
  return h + '<p class="row"><button type="button" class="small" data-act="dl">Download signoff.json</button><span class="muted">' + signoffCountText() + '</span></p>';
}

const signoffCountText = () => { const k = Object.keys(state.drafts).length; return (D.signoff.entries || []).length + ' recorded' + (k ? ' + ' + k + ' drafted this session' : ''); };

// The trail pane: every hop that carries the traced parameter, upstream then downstream, each hop one card.
function trailHtml(tr) {
  const n = by.nodes[tr.node], differ = tr.hops.filter(l => DIFFER.test(l.status.toUpperCase())).length;
  const val = (v, u) => v !== '' ? ' = ' + esc(v) + (u ? ' ' + esc(u) : '') : '';
  const flow = (a, b) => colOf(by.nodes[a.source]) - colOf(by.nodes[b.source]) || String(by.nodes[a.target].label).localeCompare(by.nodes[b.target].label) || a.index - b.index;
  const card = (l, up) => {
    const s = by.nodes[l.source], t = by.nodes[l.target], e = by.edges[l.edge], origin = up ? l.target === tr.node && l.target_name === tr.name : l.source === tr.node && l.source_name === tr.name;
    return '<div class="tcard' + (origin ? ' origin' : '') + '">' +
      '<div>' + nodeLink(s) + ' ' + (l.source_name ? '<b class="mono">' + esc(l.source_name) + '</b>' : '<span class="muted">(not named)</span>') + val(l.source_value, l.unit) + '</div>' +
      '<div class="arrow" aria-hidden="true">&darr;</div>' +
      '<div>' + nodeLink(t) + ' <b class="mono">' + esc(l.target_name) + '</b>' + val(l.target_value, '') + '</div>' +
      '<div class="chips">' + lkChip(l.status) + (e ? edgeFlagChips(e) + soGlyph(e.signoff) : '') + '</div>' +
      (l.detail ? '<div class="muted">' + esc(l.detail) + '</div>' : '') +
      (e ? '<div class="row"><button type="button" class="small" data-act="edge" data-id="' + esc(e.id) + '">Open relation</button></div>' : '') + '</div>';
  };
  const list = (title, hops, up) => '<h3>' + title + ' (' + hops.length + ')</h3>' +
    (hops.length ? hops.slice().sort(flow).map(l => card(l, up)).join('') : '<p class="muted">Nothing recorded ' + (up ? 'upstream: this is where the quantity is entered.' : 'downstream: nothing reads it.') + '</p>');
  return '<div class="hdr"><span class="muted">Parameter trail</span><span class="row"><button type="button" class="small" data-act="tfit">Fit trail</button>' +
    '<button type="button" class="small" data-act="texit">Exit trail</button></span></div>' +
    '<h2>Parameter trail &middot; <span class="mono">' + esc(tr.name) + '</span></h2><p>Traced from ' + nodeLink(n) + '</p>' +
    '<p><b>' + tr.nodes.size + ' nodes &middot; ' + tr.hops.length + ' hops &middot; ' + differ + ' differ</b></p>' +
    '<p class="muted">Each hop is one parameter crossing one relation. The graph shows only the trail; click a node to inspect it and come back with Back to trail. Differ counts hops whose two sides disagree (DIFFERS or NAME NOT IN JOURNAL); CHANGED only means a Mathcad template value was replaced by the case input.</p>' +
    list('Upstream', tr.up, true) + list('Downstream', tr.down, false);
}

// Parameters whose name contains every search token, above the tabs while nothing is selected.
function paramMatchesHtml() {
  const ps = state.search ? state.search.params : [];
  if (!ps.length) return '';
  return '<h3>Parameter matches (' + ps.length + ')</h3><ul class="plain pmatch">' + ps.slice(0, PMAX).map(p => '<li>' + nodeLink(by.nodes[p.node]) + ' &middot; <span class="mono">' + esc(p.name) + '</span>' +
    (p.value !== '' ? ' = ' + esc(p.value) + (p.unit ? ' ' + esc(p.unit) : '') : '') + ' ' + traceBtn(p.node, p.name) + '</li>').join('') + '</ul>' +
    (ps.length > PMAX ? '<p class="muted">and ' + (ps.length - PMAX) + ' more; add words to the search to narrow them.</p>' : '');
}

// What the record gained between the scrubber's previous date and the chosen one.
function asOfHtml() {
  const ds = state.dates;
  if (!ds.length) return '';
  const cut = asOfCut();
  if (!cut) return '<p class="muted">The record spans ' + esc(ds[0]) + ' to ' + esc(ds[ds.length - 1]) + '. Drag the As-of slider to look back.</p>';
  const prev = state.asOfIdx > 0 ? ds[state.asOfIdx - 1] : '';
  const within = v => { const d = isoDay(v); return d && d > prev && d <= cut; };
  const nodes = D.nodes.filter(n => within(n.registered_on)), decs = D.decisions.filter(d => within(d.date)), iss = D.issues.filter(i => within(i.last_reviewed));
  const later = D.nodes.filter(n => afterCut(cut, n.registered_on)).length;
  const list = (items, act) => items.length ? '<div class="chips">' + items.map(x => '<button type="button" class="chip" data-act="' + act + '" data-id="' + esc(x.id) + '" title="' + esc(x.label || x.decision || x.item || '') + '">' + esc(x.id) + '</button>').join('') + '</div>' : '<p class="muted">None.</p>';
  return '<h3>As of ' + esc(cut) + '</h3><p class="muted">' + (prev ? 'Changes since ' + esc(prev) + '.' : 'The earliest date in the record.') + ' ' +
    (later ? later + ' node' + (later === 1 ? '' : 's') + ' registered later ' + (later === 1 ? 'is' : 'are') + ' faded; later decisions and coherence items are hidden in their tabs.' : '') + '</p>' +
    '<div class="sec"><div class="lbl">Sources registered (' + nodes.length + ')</div>' + list(nodes, 'node') + '</div>' +
    '<div class="sec"><div class="lbl">Decisions recorded (' + decs.length + ')</div>' + list(decs, 'decgo') + '</div>' +
    '<div class="sec"><div class="lbl">Coherence items reviewed (' + iss.length + ')</div>' + list(iss, 'issgo') + '</div>';
}

function signoffOverviewHtml() {
  const S = D.signoff, signed = D.nodes.filter(n => n.signoff).concat(D.edges.filter(e => e.signoff));
  return '<h3>Sign-offs</h3><p><b>' + (S.signed_nodes || 0) + '</b> node' + (S.signed_nodes === 1 ? '' : 's') + ' and <b>' + (S.signed_edges || 0) + '</b> relation' + (S.signed_edges === 1 ? '' : 's') +
    ' signed off, <b>' + (S.stale || 0) + '</b> stale' + (S.orphans && S.orphans.length ? '; ' + S.orphans.length + ' entr' + (S.orphans.length === 1 ? 'y names' : 'ies name') + ' an id that is not in the graph (' + esc(S.orphans.join(', ')) + ')' : '') + '.' +
    (S.present ? '' : ' <span class="mono">' + esc(S.path) + '</span> is not present.') + '</p>' +
    (signed.length ? '<ul class="plain">' + signed.map(x => '<li>' + soGlyph(x.signoff) + ' <button type="button" class="link" data-act="' + (x.source ? 'edge' : 'node') + '" data-id="' + esc(x.id) + '">' + esc(x.id) + '</button> <span class="muted">' + esc(x.signoff.by + ', ' + x.signoff.on) + '</span></li>').join('') + '</ul>' : '') +
    '<p class="row"><button type="button" class="small" data-act="dl">Download signoff.json</button><span class="muted">' + signoffCountText() + '</span></p>' +
    '<p class="muted">Select a node and press Verification walk to step through what feeds it. The graph never asserts acceptance by itself: a sign-off is a statement by a named person, written by hand into <span class="mono">' + esc(S.path) + '</span>.</p>';
}

function overviewHtml() {
  const np = D.nodes.reduce((a, n) => a + n.parameters.length, 0), ep = D.edges.reduce((a, e) => a + e.parameters.length, 0);
  const open = D.issues.filter(i => i.status !== 'Closed').length, hc = healthCounts();
  return '<div class="stat"><div><b>' + D.nodes.length + '</b>nodes</div><div><b>' + D.edges.length + '</b>edges</div><div><b>' + (np + ep) + '</b>parameters</div></div>' +
    '<p class="muted">' + np + ' on nodes, ' + ep + ' on edges.</p>' + asOfHtml() + '<h3>Health</h3><div class="chips">' +
    legendCodes().map(c => '<span class="chip hc h-' + (HEALTH[c] ? c : 'NONE') + '" title="' + esc(D.health_legend[c] || '') + '"><i class="dot"></i>' + esc(c) + ' ' + (hc[c] || 0) + '</span>').join('') + '</div>' +
    '<h3>Coherence items</h3><p><b>' + open + '</b> open (not Closed) of ' + D.issues.length + '.</p>' + signoffOverviewHtml() +
    '<h3>Build</h3><dl class="kvs">' + kv('Checked (UTC)', esc(D.checked_at_utc)) + kv('Generator', esc(D.generator_version)) +
    kv('Fingerprint', '<span class="mono" title="' + esc(D.fingerprint) + '">' + esc(String(D.fingerprint || '').slice(0, 12)) + '</span>') + '</dl>' +
    '<p class="muted">Generated from project_current by scripts/build_lineage_graph.py</p>' +
    '<h3>Key</h3>' + EDGE_KEY.map(k => '<div class="key"><span class="sw" style="border-top-style:' + k[2] + ';border-top-color:' + k[3] + '"></span><span>' + esc(k[1]) + '</span></div>').join('') +
    '<p class="muted">Arrows point in the direction information flows. Click a node to trace what feeds it and what it feeds; double-click to fit that cone. Dashed node borders are unregistered sources; a red border means open coherence items; a double border and a ' + CHECK + ' in the label mean a recorded sign-off (amber when its hashes are stale).</p>';
}

const hiddenNote = (cut, n, what) => cut ? '<p class="muted">As of ' + esc(cut) + (n ? ': ' + n + ' later ' + what + (n === 1 ? '' : 's') + ' hidden.' : '.') + '</p>' : '';

function decisionsHtml() {
  const cut = asOfCut(), shown = D.decisions.filter(d => !afterCut(cut, d.date));
  return hiddenNote(cut, D.decisions.length - shown.length, 'decision') + (shown.map(d => {
    const o = state.open.dec === d.id;
    return '<div class="item"><button type="button" class="itembtn" data-act="dec" data-id="' + esc(d.id) + '" aria-expanded="' + o + '"><span class="mono">' + esc(d.id) + '</span> <span class="muted">' + esc(d.date) + '</span>' +
      (o ? '' : '<span class="clamp">' + md(d.decision) + '</span>') + '</button>' + (o ? decBlock(d, false) : '') + '</div>';
  }).join('') || '<p class="muted">No decisions.</p>');
}

function issuesHtml() {
  const cut = asOfCut(), groups = {}, shown = D.issues.filter(i => !afterCut(cut, i.last_reviewed));
  shown.forEach(i => (groups[i.status] = groups[i.status] || []).push(i));
  const order = ISSUE_ORDER.filter(s => groups[s]).concat(Object.keys(groups).filter(s => !ISSUE_ORDER.includes(s)));
  return hiddenNote(cut, D.issues.length - shown.length, 'item') + order.map(s => '<h3>' + chip(s, issCls(s)) + ' ' + groups[s].length + '</h3>' + groups[s].map(i => {
    const o = state.open.iss === i.id;
    return '<div class="item"><button type="button" class="itembtn" data-act="iss" data-id="' + esc(i.id) + '" aria-expanded="' + o + '"><span class="mono">' + esc(i.id) + '</span> <span class="muted">' + esc(i.area) + '</span>' +
      '<span class="' + (o ? '' : 'clamp') + '">' + esc(i.item) + '</span></button>' + (o ? issBlock(i, false) : '') + '</div>';
  }).join('')).join('') || '<p class="muted">No items.</p>';
}

function tabsHtml() {
  const tabs = [['overview', 'Overview'], ['decisions', 'Decisions (' + D.decisions.length + ')'], ['issues', 'Issues (' + D.issues.length + ')']];
  return '<div class="tabs" role="tablist">' + tabs.map(t => '<button type="button" role="tab" aria-selected="' + (state.tab === t[0]) + '" data-act="tab" data-tab="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>' +
    (state.tab === 'decisions' ? decisionsHtml() : state.tab === 'issues' ? issuesHtml() : overviewHtml());
}

function renderPane() {
  const pane = $('#pane'), ae = document.activeElement;
  const fkey = el => el.dataset.id || el.dataset.tab || el.dataset.d || el.dataset.i || (el.dataset.node ? el.dataset.node + '|' + el.dataset.name : '');
  const fk = ae && pane.contains(ae) && ae.dataset && ae.dataset.act ? [ae.dataset.act, fkey(ae)] : null;
  const w = state.walk && by.nodes[state.walk.target] ? state.walk : null, tr = state.trail && by.nodes[state.trail.node] ? state.trail : null;
  const key = w ? 'w:' + w.target + ':' + w.i : state.selEdge ? 'e:' + state.selEdge : state.selId ? 'n:' + state.selId : tr ? 'p:' + tr.node + '|' + tr.name : 't:' + state.tab, top = pane.scrollTop;
  pts = {}; ptSeq = 0;
  pane.innerHTML = w ? walkHtml(w) : state.selEdge && by.edges[state.selEdge] ? edgeHtml(by.edges[state.selEdge]) :
    state.selId && by.nodes[state.selId] ? nodeHtml(by.nodes[state.selId]) : tr ? trailHtml(tr) : paramMatchesHtml() + tabsHtml();
  pane.scrollTop = key === paneKey ? top : 0;
  paneKey = key;
  if (fk) {
    const el = [...pane.querySelectorAll('[data-act]')].find(x => x.dataset.act === fk[0] && fkey(x) === fk[1]);
    if (el) el.focus({ preventScroll: true });
  }
}

function copyText(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = o; }, 1200); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try { if (document.execCommand('copy')) done(); } catch (err) { /* ignore */ }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

// ---------- header controls ----------
function legendCodes() {
  const c = Object.keys(D.health_legend);
  D.nodes.forEach(n => { if (!c.includes(n.health)) c.push(n.health); });
  return c;
}
function healthCounts() {
  const hc = {};
  D.nodes.forEach(n => { hc[n.health] = (hc[n.health] || 0) + 1; });
  return hc;
}
function renderLegend() {
  const hc = healthCounts();
  $('#legend').innerHTML = legendCodes().map(c => '<button type="button" class="chip hc h-' + (HEALTH[c] ? c : 'NONE') + '" data-health="' + esc(c) + '" aria-pressed="' + !!state.health[c] +
    '" title="' + esc((D.health_legend[c] || c) + ' (click to filter)') + '"><i class="dot"></i>' + esc(c) + ' <b>' + (hc[c] || 0) + '</b></button>').join('');
}

function zoomBy(f) {
  if (!cy) return;
  cy.zoom({ level: Math.max(cy.minZoom(), Math.min(cy.maxZoom(), cy.zoom() * f)), renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } });
}

function wire() {
  const pane = $('#pane');
  pane.addEventListener('click', ev => {
    const b = ev.target.closest('[data-act],[data-copy],[data-copy-prev]');
    if (!b) return;
    if (b.dataset.copy !== undefined) { copyText(b.dataset.copy, b); return; }
    if (b.dataset.copyPrev !== undefined) { const ta = b.parentElement.previousElementSibling; if (ta && ta.tagName === 'TEXTAREA') copyText(ta.value, b); return; }
    const id = b.dataset.id;
    switch (b.dataset.act) {
      case 'tab': state.tab = b.dataset.tab; renderPane(); break;
      case 'dec': toggleRef('dec', id); break;
      case 'iss': toggleRef('iss', id); break;
      case 'decgo': state.tab = 'decisions'; state.open.dec = null; toggleRef('dec', id); break;
      case 'issgo': state.tab = 'issues'; state.open.iss = null; toggleRef('iss', id); break;
      case 'node': selectNode(id, true); break;
      case 'edge': selectEdge(id); break;
      case 'back': state.selEdge = null; state.draft = null; applyView(); renderPane(); break;
      case 'clear': clearSelection(); break;
      case 'trace': traceParam(b.dataset.node, b.dataset.name); break;
      case 'tback': backToTrail(); break;
      case 'texit': exitTrail(); break;
      case 'tfit': fitTrail(); break;
      case 'walk': startWalk(id || state.selId); break;
      case 'wstep': if (state.walk) walkTo(state.walk.i + Number(b.dataset.d)); break;
      case 'wgo': walkTo(Number(b.dataset.i)); break;
      case 'wexit': endWalk(); break;
      case 'draft': toggleDraft(id); break;
      case 'keep': keepDraft(id); break;
      case 'dl': downloadSignoffs(); break;
      case 'more': {
        const t = pts[b.dataset.key];
        if (t) { t.all = !t.all; $('.ptwrap[data-key="' + b.dataset.key + '"] .pt-body', pane).innerHTML = ptBody(b.dataset.key); }
        break;
      }
    }
  });
  // <details> toggle events do not bubble: remember what the reader opened or closed across redraws.
  pane.addEventListener('toggle', ev => { const d = ev.target; if (d && d.tagName === 'DETAILS' && d.dataset.key) state.detOpen[d.dataset.key] = d.open; }, true);
  pane.addEventListener('input', ev => {
    const el = ev.target;
    if (!el.classList) return;
    if (el.classList.contains('pt-filter') && pts[el.dataset.key]) {
      pts[el.dataset.key].filter = el.value;
      $('.ptwrap[data-key="' + el.dataset.key + '"] .pt-body', pane).innerHTML = ptBody(el.dataset.key);
      return;
    }
    const f = el.closest('form.draft');
    if (f && state.draft && state.draft.id === f.dataset.id && el.name in state.draft) state.draft[el.name] = el.value;
  });
  pane.addEventListener('submit', ev => {
    const f = ev.target.closest && ev.target.closest('form.draft');
    if (!f) return;
    ev.preventDefault();
    makeDraft(f.dataset.id);
  });
  const asof = $('#asof');
  if (state.dates.length > 1) {
    asof.max = state.dates.length - 1;
    asof.addEventListener('input', () => setAsOf(Number(asof.value)));
    $('#asof-latest').addEventListener('click', () => setAsOf(state.dates.length - 1));
    setAsOf(state.dates.length - 1);
  } else $('#scrub').hidden = true;
  let qt = null;
  const q = $('#q');
  q.addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(doSearch, 150); });
  q.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') {
      clearTimeout(qt); doSearch();
      const s = state.search;
      if (s && s.nodes.size === 1) selectNode([...s.nodes][0], true);
      else if (s && s.params.length === 1) traceParam(s.params[0].node, s.params[0].name);
    }
  });
  $('#dirs').addEventListener('click', ev => {
    const b = ev.target.closest('[data-dir]');
    if (!b) return;
    state.dir = b.dataset.dir;
    document.querySelectorAll('#dirs button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    refreshSelection();
  });
  $('#isolate').addEventListener('change', ev => { state.isolate = ev.target.checked; syncGraph(); applyView(); });
  $('#legend').addEventListener('click', ev => {
    const b = ev.target.closest('[data-health]');
    if (!b) return;
    const c = b.dataset.health;
    state.health[c] = !state.health[c];
    b.setAttribute('aria-pressed', String(!!state.health[c]));
    applyView();
  });
  $('#zfit').addEventListener('click', () => { if (cy) cy.animate({ fit: { eles: cy.elements(), padding: 30 } }, { duration: 200 }); });
  $('#zin').addEventListener('click', () => zoomBy(1.25));
  $('#zout').addEventListener('click', () => zoomBy(0.8));
}

// ---------- cytoscape ----------
function showMsg(text) {
  const m = $('#cy-msg');
  m.textContent = text; m.hidden = false; $('#cy').hidden = true;
  ['zfit', 'zin', 'zout', 'isolate'].forEach(id => { $('#' + id).disabled = true; });
}

function restyle() { if (cy) cy.style(buildStyle()); }

function initCy() {
  // width/height "label" sizing is deprecated in 3.30 but works in the pinned version; skip the console warning.
  if (typeof window.cytoscape.warnings === 'function') window.cytoscape.warnings(false);
  cy = window.cytoscape({
    container: $('#cy'), elements: [], style: buildStyle(), minZoom: 0.15, maxZoom: 3,
    autoungrabify: true, autounselectify: true, boxSelectionEnabled: false
  });
  rebuild(null);
  graphKey = '*';
  cy.on('zoom', applyZoomMode);
  cy.on('tap', ev => {
    const t = ev.target;
    if (t === cy) { clearSelection(); return; }
    if (t.isEdge()) { selectEdge(t.id()); return; }
    if (!t.isNode() || t.isParent()) return;
    const now = Date.now(), dbl = lastTap.id === t.id() && now - lastTap.t < 350;
    lastTap = dbl ? { id: null, t: 0 } : { id: t.id(), t: now };
    if (dbl) { fitCone(); return; }
    selectNode(t.id(), false);
  });
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  if (mq) { if (mq.addEventListener) mq.addEventListener('change', restyle); else if (mq.addListener) mq.addListener(restyle); }
  window.addEventListener('resize', () => { if (cy) cy.resize(); });
}

function init() {
  try {
    loadData();
  } catch (err) {
    $('#pane').innerHTML = '<p>The lineage data could not be read (' + esc(err.message) + '). Open lineage/index.html, which is generated by scripts/build_lineage_graph.py.</p>';
    showMsg('No lineage data is embedded in this page.');
    return;
  }
  renderLegend(); wire(); renderPane();
  if (!window.cytoscape) {
    showMsg('Cytoscape could not be loaded from cdnjs. The graph needs an internet connection the first time it is opened.');
    return;
  }
  try { initCy(); } catch (err) { cy = null; showMsg('The graph could not be drawn: ' + err.message); }
}

try { init(); } catch (err) { const m = $('#cy-msg'); m.textContent = 'Viewer error: ' + err.message; m.hidden = false; }
window.__lineage = { state, restyle, selectNode, selectEdge, clearSelection, startWalk, walkTo, endWalk, walkHops, setAsOf, toggleDraft, makeDraft, keepDraft,
  signoffDocument, downloadSignoffs, trace: traceParam, exitTrail, fitTrail, get trail() { return state.trail; }, get cy() { return cy; }, get data() { return D; } };
})();
</script>
</body>
