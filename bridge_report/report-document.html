<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bridge geometry · interactive station report</title>
<style>
  :root { color-scheme:light dark; --background:light-dark(#ffffff,#151719); --foreground:light-dark(#202a35,#e8edf2); --muted-foreground:light-dark(#526170,#aebbc8); --border:light-dark(#d7dfe7,#3b4753); --popover:light-dark(#ffffff,#232a31); --popover-foreground:var(--foreground); --primary:light-dark(#283847,#dfebf6); --primary-foreground:var(--background); --input:var(--border); --viz-series-1:light-dark(#176ca4,#69b4e4); --viz-series-2:light-dark(#9c5113,#efa665); --viz-series-3:light-dark(#8d4c92,#d19dd5); --viz-series-4:light-dark(#596c81,#9bb1c9); --viz-series-5:light-dark(#24755f,#74c5ab); --viz-series-6:light-dark(#b23e50,#f58d9e); --destructive:light-dark(#b1293d,#ff95a3); --font-size-base:14px; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--background); color:var(--foreground); }
  main { max-width:1024px; margin:auto; }
  h2,h3,strong,th { font-weight:500; }
  h2 { font-size:22px; line-height:1.3; margin:0 0 18px; }
  h3 { font-size:16px; margin:18px 0 8px; }
  .text-small { font-size:12px; } .text-muted { color:var(--muted-foreground); } .text-destructive { color:var(--destructive); }
  .tabular-nums,.text-end { font-variant-numeric:tabular-nums; }
  .text-end { text-align:right; }
  .viz-controls { display:flex; flex-wrap:wrap; gap:12px; }
  .form-label { display:flex; flex:1 1 240px; flex-direction:column; gap:5px; }
  .form-control,.form-select { display:block; width:100%; min-height:38px; padding:8px 10px; border:1px solid var(--input); border-radius:5px; background:var(--background); color:var(--foreground); font:inherit; }
  .form-range { display:block; width:100%; height:28px; margin:4px 0 8px; accent-color:var(--primary); }
  button { cursor:pointer; }
  .table-responsive { max-width:100%; overflow-x:auto; }
  .table { border-collapse:collapse; width:100%; margin-top:18px; }
  .table th,.table td { padding:7px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  .table th:first-child { text-align:left; }
  .table td { white-space:nowrap; }
  .table thead { color:var(--muted-foreground); }
  [hidden] { display:none!important; }
  :focus-visible { outline:2px solid var(--primary); outline-offset:3px; }
  @media(max-width:480px){body{padding:12px;} .form-control,.form-select {font-size:16px;} }
  @media print { body{padding:0;color-scheme:light;} .viz-controls,.form-range,.bridge-legend,#bridge-hover {display:none!important;} section {break-inside:avoid;} .table {font-size:11px;} }
</style>
</head>
<body><main>
__FRAGMENT__
</main></body>
</html>
